tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of contacts with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
    example: 1
    description: Page number for pagination (starts from 1)
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      example: 10
      description: Number of contacts per page
  - in: query
    name: sortBy
    schema:
      type: string
      enum: ['_id', 'name', 'phoneNumber', 'email']
      example: '_id'
    description: "Sort by any contact field (e.g. name, phoneNumber, email). Default: _id"
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
  - in: query
    name: contactType
    schema:
      type: string
      enum: ["work", "home", "personal"]
      example: personal
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: false
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 1
                totalItems:
                  type: integer
                  example: 1
                totalPages:
                  type: integer
                  example: 1
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/contacts/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'


